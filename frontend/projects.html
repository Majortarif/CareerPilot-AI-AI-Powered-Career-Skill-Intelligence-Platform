<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Ideas · CareerPilot AI</title>
  <meta name="description" content="Portfolio project ideas ranked by your skill gaps and target role.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script type="module" src="js/projects.js"></script>
</head>
<body data-page="projects">
  <a class="skip-link" href="#main">Skip to main content</a>
  <div class="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="app-main">
      <header id="topbar" class="topbar"></header>
      <main id="main" class="page" tabindex="-1">
        <div class="page-header">
          <div>
            <p class="eyebrow">Growth</p>
            <h1 class="page-title">Project Recommendations</h1>
            <p class="page-subtitle" id="projects-sub">Portfolio project ideas ranked by your skill gaps and target role.</p>
          </div>
        </div>

        <section class="card card-pad mb-4" aria-label="Filters">
          <form id="filters" class="grid gap-3 sm:grid-cols-2 xl:grid-cols-6" role="search">
            <div class="input-icon sm:col-span-2 xl:col-span-2">
              <i data-lucide="search" aria-hidden="true"></i>
              <label for="f-query" class="sr-only">Search projects</label>
              <input class="input" id="f-query" name="query" type="search" placeholder="Search projects or technologies">
            </div>
            <div><label for="f-category" class="sr-only">Category</label><select class="select" id="f-category" name="category"></select></div>
            <div><label for="f-difficulty" class="sr-only">Difficulty</label><select class="select" id="f-difficulty" name="difficulty"></select></div>
            <div><label for="f-technology" class="sr-only">Technology</label><select class="select" id="f-technology" name="technology"></select></div>
            <div><label for="f-objective" class="sr-only">Learning objective</label><select class="select" id="f-objective" name="objective"></select></div>
          </form>
          <div class="mt-3 flex flex-wrap items-center justify-between gap-2">
            <p class="text-sm text-muted" id="result-count" aria-live="polite"></p>
            <button type="button" class="btn btn-ghost btn-sm" id="reset-filters"><i data-lucide="filter-x" aria-hidden="true"></i>Reset filters</button>
          </div>
        </section>

        <div data-page-body>
          <div id="project-grid" class="grid gap-4 md:grid-cols-2 2xl:grid-cols-3">
            <div class="skeleton skeleton-card h-72"></div><div class="skeleton skeleton-card h-72"></div><div class="skeleton skeleton-card h-72"></div><div class="skeleton skeleton-card h-72"></div>
          </div>
        </div>
      </main>
    </div>
  </div>
  <nav id="bottom-nav" class="bottom-nav" aria-label="Quick navigation"></nav>
</body>
</html>
